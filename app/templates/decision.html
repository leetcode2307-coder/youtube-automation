<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ page_title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v={{ asset_version|default('1') }}">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("studio-theme");
        if (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) t = "dark";
        if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
      } catch (_e) {}
    })();
  </script>
</head>
<body>
  <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;">
    <div class="card card-pad" style="max-width:540px; width:100%; text-align:center;">
      <div style="margin-bottom:12px;">
        <span class="badge badge-{{ 'success' if decision == 'approved' else 'danger' }}">{{ status_badge }}</span>
      </div>
      <h1 style="margin:0 0 8px 0; font-size:24px;">{{ heading }}</h1>
      <p style="margin:0 0 16px 0; font-size:14px; color:var(--color-muted-foreground);">
        Run ID: <span class="mono">{{ run_id }}</span>
      </p>

      <div class="next-step-callout" style="text-align:left; border-left-color:{{ 'var(--status-success-fg)' if decision == 'approved' else 'var(--status-danger-fg)' }};">
        {{ message | safe }}
      </div>

      {% if studio_url %}
      <div style="margin:16px 0;">
        <a href="{{ studio_url }}" target="_blank" class="btn btn-primary">Open in YouTube Studio</a>
      </div>
      {% endif %}

      <p style="font-size:12px; color:var(--color-muted-foreground); margin:16px 0;">
        This one-time approval link was consumed at <span class="mono">{{ timestamp }}</span> and cannot be reused.
      </p>

      <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
        <button type="button" class="btn btn-secondary" onclick="var cur=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';var nxt=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',nxt);try{localStorage.setItem('studio-theme',nxt);}catch(_e){}">Toggle Theme</button>
        <a href="/" class="btn btn-secondary">Back to Studio Dashboard</a>
      </div>
    </div>
  </div>
</body>
</html>
